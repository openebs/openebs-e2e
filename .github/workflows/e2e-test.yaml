name: e2e tests
on:
  workflow_dispatch:
    inputs:
      openebs_chart_version:
        description: 'OpenEBS Helm Chart Version'
        required: false
        default: '4.3.2'
        type: string
      oci_install:
        description: 'Use OCI install method'
        required: false
        default: false
        type: boolean

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v11
        with:
          kvm: true
      - uses: DeterminateSystems/magic-nix-cache-action@v6
      - name: Pre-populate nix-shell
        run: |
          export NIX_PATH=nixpkgs=$(jq '.nixpkgs.url' nix/sources.json -r)
          echo "NIX_PATH=$NIX_PATH" >> $GITHUB_ENV
          nix-shell shell.nix --run "echo"
      - name: Go checks
        run: |
          nix-shell shell.nix --run "./scripts/go-checks.sh"
  lvm:
    needs: ['lint']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v11
        with:
          kvm: true
      - uses: DeterminateSystems/magic-nix-cache-action@v6
      - name: Pre-populate nix-shell
        run: |
          export NIX_PATH=nixpkgs=$(jq '.nixpkgs.url' nix/sources.json -r)
          echo "NIX_PATH=$NIX_PATH" >> $GITHUB_ENV
          nix-shell shell.nix --run "echo"
      - name: BootStrap k8s cluster
        run: |
          nix-shell shell.nix --run "./scripts/k8s/deployer.sh start --workers 1 --lvm"
      - name: Lvm e2e test
        run: |
          nix-shell shell.nix --run "./scripts/e2e-test.sh --testplan lvm -openebs_chart_version ${{ github.event.inputs.openebs_chart_version }} --oci ${{ github.event.inputs.oci_install }}"
  zfs:
    needs: ['lint']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v11
        with:
          kvm: true
      - uses: DeterminateSystems/magic-nix-cache-action@v6
      - name: Pre-populate nix-shell
        run: |
          export NIX_PATH=nixpkgs=$(jq '.nixpkgs.url' nix/sources.json -r)
          echo "NIX_PATH=$NIX_PATH" >> $GITHUB_ENV
          nix-shell shell.nix --run "echo"
      - name: BootStrap k8s cluster
        run: |
          nix-shell shell.nix --run "./scripts/k8s/deployer.sh start --workers 1 --zfs"
      - name: Zfs e2e test
        run: |
          nix-shell shell.nix --run "./scripts/e2e-test.sh --testplan zfs -openebs_chart_version ${{ github.event.inputs.openebs_chart_version }} --oci ${{ github.event.inputs.oci_install }}"
  hostpath:
    needs: ['lint']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v11
        with:
          kvm: true
      - uses: DeterminateSystems/magic-nix-cache-action@v6
      - name: Pre-populate nix-shell
        run: |
          export NIX_PATH=nixpkgs=$(jq '.nixpkgs.url' nix/sources.json -r)
          echo "NIX_PATH=$NIX_PATH" >> $GITHUB_ENV
          nix-shell shell.nix --run "echo"
      - name: BootStrap k8s cluster
        run: |
          nix-shell shell.nix --run "./scripts/k8s/deployer.sh start --workers 1"
      - name: Hostpath e2e test
        run: |
          nix-shell shell.nix --run "./scripts/e2e-test.sh --testplan hostpath -openebs_chart_version ${{ github.event.inputs.openebs_chart_version }} --oci ${{ github.event.inputs.oci_install }}"
